<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Eldar Hamidov logo">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="38%">
      <stop offset="0%" stop-color="#2a2a28"/>
      <stop offset="100%" stop-color="#0f0f0e"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c99a5a"/>
      <stop offset="100%" stop-color="#f0c98a"/>
    </linearGradient>
  </defs>
  <!-- circular engineering badge - completely different from square/chip -->
  <circle cx="60" cy="60" r="54" fill="url(#bg3)" stroke="url(#ring)" stroke-width="2"/>
  <!-- outer gap ticks - engineering notches -->
  <g stroke="#c99a5a" stroke-width="2.2" stroke-linecap="round" opacity="0.95">
    <path d="M60 10 V20"/>
    <path d="M60 100 V110"/>
    <path d="M10 60 H20"/>
    <path d="M100 60 H110"/>
  </g>
  <g stroke="#faf8f5" stroke-width="1.1" opacity="0.18" stroke-linecap="round">
    <path d="M24 24 L32 32"/>
    <path d="M96 24 L88 32"/>
    <path d="M24 96 L32 88"/>
    <path d="M96 96 L88 88"/>
  </g>
  <!-- abstract E monogram - 3 lines + vertical + AI dot, not EH text -->
  <g fill="none" stroke-linecap="round">
    <!-- vertical spine -->
    <path d="M42 38 V82" stroke="#faf8f5" stroke-width="7" stroke-linecap="round"/>
    <!-- 3 horizontal arms -->
    <path d="M42 38 H76" stroke="#faf8f5" stroke-width="7"/>
    <path d="M42 60 H68" stroke="#faf8f5" stroke-width="7"/>
    <path d="M42 82 H76" stroke="#faf8f5" stroke-width="7"/>
    <!-- AI accent - replaces dot, integrated into E -->
    <circle cx="76" cy="38" r="6.5" fill="url(#ring)" stroke="#0f0f0e" stroke-width="2"/>
    <circle cx="76" cy="60" r="5.2" fill="url(#ring)" stroke="#0f0f0e" stroke-width="1.6"/>
    <circle cx="76" cy="82" r="6.5" fill="url(#ring)" stroke="#0f0f0e" stroke-width="2"/>
  </g>
  <!-- center highlight - small white core -->
  <circle cx="60" cy="60" r="1.8" fill="#fff" opacity="0.0"/>
</svg>
