<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Eldar Hamidov logo">
  <!-- LIGHT premium badge - opposite of all dark previous, completely different -->
  <rect width="120" height="120" rx="28" fill="#faf8f5" stroke="#e8e2d9" stroke-width="1.5"/>
  <!-- inner thin line -->
  <rect x="10" y="10" width="100" height="100" rx="20" fill="none" stroke="#1d1d1f" stroke-width="0.8" opacity="0.08"/>
  <!-- minimal E - single stroke, ultra clean -->
  <g fill="none" stroke="#1d1d1f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 34 H84" stroke-width="8"/>
    <path d="M38 34 V86" stroke-width="8"/>
    <path d="M38 60 H72" stroke-width="8"/>
    <path d="M38 86 H84" stroke-width="8"/>
  </g>
  <!-- single gold accent dot - the AI pulse, minimal -->
  <circle cx="88" cy="34" r="6" fill="#8a5a2b" stroke="#faf8f5" stroke-width="2.5"/>
  <!-- small gold bar bottom - signature, thin -->
  <rect x="38" y="98" width="44" height="3" rx="1.5" fill="#8a5a2b" opacity="0.9"/>
</svg>
