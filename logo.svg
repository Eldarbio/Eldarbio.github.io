<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Eldar Hamidov logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e1c"/>
      <stop offset="100%" stop-color="#131312"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c99a5a"/>
      <stop offset="100%" stop-color="#e0b27a"/>
    </linearGradient>
  </defs>
  <!-- outer premium plate -->
  <rect width="120" height="120" rx="26" fill="url(#bg)" stroke="#2a2a28" stroke-width="1.5"/>
  <!-- inner subtle hexagon frame -->
  <path d="M60 18 L86 32 L86 64 L60 78 L34 64 L34 32 Z" fill="none" stroke="#c99a5a" stroke-width="1.2" opacity="0.28"/>
  <path d="M60 22 L82.5 34.5 L82.5 61.5 L60 74 L37.5 61.5 L37.5 34.5 Z" fill="none" stroke="#faf8f5" stroke-width="0.7" opacity="0.12"/>
  <!-- EH monogram - engineered, geometric -->
  <g font-family="Instrument Sans, sans-serif" font-weight="800" text-anchor="middle">
    <!-- E -->
    <text x="43.5" y="68" font-size="42" fill="#faf8f5" letter-spacing="-2.5">E</text>
    <!-- H -->
    <text x="76.5" y="68" font-size="42" fill="#faf8f5" letter-spacing="-2.5">H</text>
  </g>
  <!-- central connector - AI / circuit bridge between E and H -->
  <rect x="58.5" y="38" width="3" height="34" rx="1.5" fill="url(#accent)" opacity="0.95"/>
  <circle cx="60" cy="36" r="4.5" fill="#c99a5a" stroke="#1e1e1c" stroke-width="2"/>
  <circle cx="60" cy="74.5" r="4.5" fill="#c99a5a" stroke="#1e1e1c" stroke-width="2"/>
  <!-- bottom signature bar - premium -->
  <rect x="32" y="88" width="56" height="3.2" rx="1.6" fill="url(#accent)"/>
  <!-- top small dots - sensors -->
  <circle cx="28" cy="24" r="2.2" fill="#c99a5a" opacity="0.9"/>
  <circle cx="92" cy="24" r="2.2" fill="#c99a5a" opacity="0.6"/>
  <circle cx="60" cy="16" r="1.6" fill="#faf8f5" opacity="0.75"/>
</svg>
