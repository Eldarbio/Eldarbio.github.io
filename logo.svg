<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Eldar monogram">
  <!-- Concept 1: Monogram EH - minimal premium, black/white -->
  <rect width="120" height="120" rx="24" fill="#1d1d1f"/>
  <!-- monogram: E+H sharing vertical stem - geometric, thin premium -->
  <g fill="none" stroke="#faf8f5" stroke-linecap="round" stroke-linejoin="round">
    <!-- shared vertical -->
    <path d="M42 30 V90" stroke-width="5.5"/>
    <!-- E bars -->
    <path d="M42 30 H80" stroke-width="5.5"/>
    <path d="M42 60 H70" stroke-width="5.5"/>
    <path d="M42 90 H80" stroke-width="5.5"/>
    <!-- H right stem + bridge -->
    <path d="M84 30 V90" stroke-width="5.5"/>
    <path d="M42 60 H84" stroke-width="5.5" opacity="0.0"/>
    <path d="M62 60 H84" stroke-width="5.5"/>
  </g>
  <!-- subtle engineering joint - single small square at intersection -->
  <rect x="57.5" y="57.5" width="5" height="5" rx="1" fill="#faf8f5" opacity="0.95"/>
</svg>
