<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Eldar Hamidov logo">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232320"/>
      <stop offset="100%" stop-color="#0f0f0e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c99a5a"/>
      <stop offset="100%" stop-color="#f0c98a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- premium chip shape - cut corners engineering -->
  <path d="M24 8 H96 L112 24 V96 L96 112 H24 L8 96 V24 Z" fill="url(#bg2)" stroke="url(#gold)" stroke-width="1.8" filter="url(#shadow)"/>
  <!-- inner chip line -->
  <path d="M28 16 H92 L104 28 V92 L92 104 H28 L16 92 V28 Z" fill="none" stroke="#c99a5a" stroke-width="0.9" opacity="0.35"/>
  <!-- circuit traces - distinct -->
  <g stroke="#c99a5a" stroke-width="1.1" opacity="0.9" fill="none" stroke-linecap="round">
    <path d="M8 36 H16"/>
    <path d="M8 84 H16"/>
    <path d="M104 36 H112"/>
    <path d="M104 84 H112"/>
  </g>
  <circle cx="16" cy="36" r="2.3" fill="#c99a5a"/>
  <circle cx="16" cy="84" r="2.3" fill="#c99a5a"/>
  <circle cx="104" cy="36" r="2.3" fill="#c99a5a"/>
  <circle cx="104" cy="84" r="2.3" fill="#c99a5a"/>
  <!-- merged EH monogram - shared stem, negative space concept -->
  <g font-family="Instrument Sans, sans-serif" font-weight="900" text-anchor="middle">
    <!-- E left with 3 bars, H right with bridge - constructed as shapes not just text for distinct -->
    <g fill="#faf8f5">
      <!-- E -->
      <rect x="34" y="38" width="28" height="6" rx="1.8"/>
      <rect x="34" y="57" width="22" height="6" rx="1.8"/>
      <rect x="34" y="76" width="28" height="6" rx="1.8"/>
      <rect x="34" y="38" width="6" height="44" rx="1.8"/>
      <!-- H -->
      <rect x="68" y="38" width="6" height="44" rx="1.8"/>
      <rect x="92" y="38" width="6" height="44" rx="1.8"/>
      <rect x="68" y="57" width="30" height="6" rx="1.8"/>
    </g>
  </g>
  <!-- AI pulse dot top center - distinct signature -->
  <circle cx="60" cy="20" r="4.2" fill="url(#gold)" stroke="#0f0f0e" stroke-width="1.6"/>
  <circle cx="60" cy="20" r="1.4" fill="#fff" opacity="0.95"/>
</svg>
