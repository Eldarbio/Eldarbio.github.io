<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Abstract engineering">
  <!-- Concept 3: Abstract - three lines converging = robotic arm + code + solution -->
  <rect width="120" height="120" rx="24" fill="#1d1d1f"/>
  <g stroke="#faf8f5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- three elements converging to one point (creation) -->
    <path d="M24 34 H72 L88 60" stroke-width="5.2"/>
    <path d="M24 60 H88" stroke-width="5.2"/>
    <path d="M24 86 H72 L88 60" stroke-width="5.2"/>
    <!-- convergence node -->
    <circle cx="88" cy="60" r="7" fill="#faf8f5" stroke="#1d1d1f" stroke-width="2.2"/>
    <circle cx="88" cy="60" r="2.2" fill="#1d1d1f"/>
  </g>
  <g fill="#faf8f5" opacity="0.35">
    <circle cx="24" cy="34" r="2"/>
    <circle cx="24" cy="60" r="2"/>
    <circle cx="24" cy="86" r="2"/>
  </g>
</svg>
