<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Geometric E">
  <!-- Concept 2: Geometric E - abstract, circuit/mechanical hint, no cyberpunk -->
  <rect width="120" height="120" rx="24" fill="#1d1d1f"/>
  <g fill="none" stroke="#faf8f5" stroke-linecap="round" stroke-linejoin="round">
    <!-- vertical -->
    <path d="M38 28 V92" stroke-width="5"/>
    <!-- top bar with subtle joint angle -->
    <path d="M38 28 H82" stroke-width="5"/>
    <path d="M38 60 H74" stroke-width="5"/>
    <path d="M38 92 H82" stroke-width="5"/>
    <!-- engineering joint - small break -->
    <circle cx="68" cy="60" r="3.2" fill="#faf8f5" stroke="#1d1d1f" stroke-width="1.5"/>
  </g>
  <!-- outer thin frame hint -->
  <rect x="14" y="14" width="92" height="92" rx="16" fill="none" stroke="#faf8f5" stroke-width="0.7" opacity="0.14"/>
</svg>
